name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The suite finishes in well under a minute; a wedged test or runner
    # should fail fast instead of holding the job for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes (zizmor `artipacked`)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Deprecated config is only an `info`, which `--error-on-warnings` lets
      # through; `migrate` has no check mode, hence write-then-diff.
      - name: Biome config needs no migration
        run: |
          node scripts/biome.mjs migrate --write
          git diff --exit-code biome.json

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
              console.log("| Metric | Coverage |\n| --- | --- |");
              ["lines","statements","functions","branches"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - run: pnpm build

      - run: node scripts/smoke-test.mjs

      - run: pnpm pack --pack-destination .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: '*.tgz'
          retention-days: 1
          if-no-files-found: error

  smoke-node20:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - run: npm install -g ./*.tgz

      - name: Verify tarball runs on Node 20
        run: |
          set -euo pipefail
          OUT=$(env LOG_LEVEL=info timeout 5 zendesk-mcp-server smoke-test 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "stdio_transport_ready"
