name: Security

# Fork-side security gate (Measurabl fork of fruggr/zendesk-mcp-server).
# Purpose: every change — especially upstream code arriving via a sync PR —
# is statically scanned and its dependency delta reviewed BEFORE it lands on
# main. Merge upstream through a pull request (see upstream-sync.yml), never
# the "Sync fork" button, or these checks cannot gate anything.
#
# All third-party actions are pinned to full commit SHAs; the zizmor job
# enforces that pinning stays in place for any workflow edited or added later.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan so new advisories against an unchanged tree still surface.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  dependency-review:
    name: Dependency review
    # Diff-based by nature, so PR-only. Fails the PR when it introduces a
    # dependency with a known vulnerability — the primary gate for a sync PR
    # that bumps pnpm-lock.yaml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  audit:
    name: pnpm audit
    # Absolute scan of the full lockfile (not just the diff): catches
    # advisories published after a dependency already landed. pnpm audit
    # reads package.json + pnpm-lock.yaml directly; no install needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm audit --audit-level moderate

  zizmor:
    name: Workflow security (zizmor)
    # Static analysis of the GitHub Actions workflows themselves: unpinned
    # actions, pwn-request patterns, template injection, credential
    # persistence. This is what stops a future upstream workflow change from
    # quietly reintroducing an unpinned or injectable step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Gate on medium+; suppressions with rationale live in
          # .github/zizmor.yml. Findings also upload as code-scanning alerts.
          min-severity: medium
